<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<title>Painel da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de celular (máx. 520px), abas fixas embaixo, botão "+ Gasto" sempre à mão */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1E2A38; --muted:#5F6E7C; --line:#DCE2E8;
  --navy:#1B365D; --slate:#4A777A; --slate-soft:#E3EEEE; --navy-soft:#E6ECF4;
  --good:#2F7D5B; --good-soft:#E2F2EA; --warn:#B7791F; --warn-soft:#FBF0DC; --bad:#B23A3A; --bad-soft:#F8E3E3;
  --on-navy:#FFFFFF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --surface:#17222E; --ink:#E7EDF3; --muted:#9AA8B6; --line:#2A3846;
  --navy:#7FA4D6; --slate:#78B0B3; --slate-soft:#1D3436; --navy-soft:#1A2A40;
  --good:#5CC495; --good-soft:#163026; --warn:#E3AE5A; --warn-soft:#33270F; --bad:#EE7B7B; --bad-soft:#3A1C1C;
  --on-navy:#0F1720; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#17222E; --ink:#E7EDF3; --muted:#9AA8B6; --line:#2A3846;
  --navy:#7FA4D6; --slate:#78B0B3; --slate-soft:#1D3436; --navy-soft:#1A2A40;
  --good:#5CC495; --good-soft:#163026; --warn:#E3AE5A; --warn-soft:#33270F; --bad:#EE7B7B; --bad-soft:#3A1C1C;
  --on-navy:#0F1720; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:18px 150px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;color:var(--navy)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--slate)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.45rem;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:var(--muted)}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.hero .lbl{font-size:.95rem;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,12vw,3.4rem);line-height:1;letter-spacing:-.02em}
.hero .sub{font-size:.95rem;opacity:.88}
.todaybar{margin-top:10px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-navy) 22%,transparent);overflow:hidden}
.todaybar i{display:block;height:100%;background:var(--on-navy);border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--on-navy) 16%,transparent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.section{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.why{border-left:4px solid var(--slate);background:var(--slate-soft);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.why q{font-family:var(--display);font-size:1.15rem;font-weight:600;quotes:"“" "”";color:var(--ink)}
.alert{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.alert b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--slate);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* categories */
.cats{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat{display:grid;grid-template-columns:36px 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.cat:last-child{border-bottom:0}
.cat .ico{grid-row:span 2;font-size:1.3rem;width:36px;height:36px;border-radius:10px;background:var(--navy-soft);display:grid;place-items:center}
.cat .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .rest{font-weight:700;text-align:right}
.cat .bar{grid-column:2 / 4;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:99px;background:var(--slate)}
.cat.warn .bar i{background:var(--warn)} .cat.over .bar i{background:var(--bad)}
.cat.over .rest{color:var(--bad)}
.cat .rest small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}

/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:700;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:1.1rem}
.del.armed{background:var(--bad);color:#fff;width:auto;padding:0 10px;font-size:.8rem;font-weight:700}
.empty{padding:18px;text-align:center;color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:12px;min-height:50px;padding:0 18px;font-weight:700;font-size:1rem;background:var(--navy);color:var(--on-navy)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.block{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}.btnrow .btn{flex:1 1 140px}

/* bottom nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:none;border-radius:12px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px;stroke:currentColor}
.nav button[aria-current="page"]{color:var(--navy);background:var(--navy-soft)}
.nav .badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:.65rem;border-radius:99px;padding:1px 6px}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:99px;height:60px;padding:0 24px 0 18px;background:var(--slate);color:#fff;font-weight:800;font-size:1.08rem;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px color-mix(in srgb,var(--slate) 45%,transparent)}
.fab svg{width:24px;height:24px;stroke:#fff}
@media (min-width:600px){.fab{right:calc(50% - 260px + 18px)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,18,28,.5)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.amount{font-family:var(--display);font-weight:800;font-size:2.8rem;text-align:center;color:var(--navy);letter-spacing:-.02em}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;font-weight:600}
.catpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.catpick button{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:52px;padding:8px 10px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem;min-width:0}
.catpick button span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catpick button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
input.i,textarea.i,select.i{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
textarea.i{min-height:88px;resize:vertical}
.hint{font-size:.86rem;color:var(--muted)}
.pause{background:var(--warn-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.pause h3{font-size:1.2rem}

/* metas */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border-radius:12px;padding:10px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.step b{font-size:.92rem}
.step.done{background:var(--good-soft);border-color:transparent}
.step.now{background:var(--navy);color:var(--on-navy);border-color:transparent}
.step.now .muted{color:inherit;opacity:.8}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kpi strong{font-family:var(--display);font-size:1.6rem;color:var(--navy)}

/* guia */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.g summary{list-style:none;padding:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
details.g summary::-webkit-details-marker{display:none}
details.g summary h3{font-size:1.05rem}
details.g summary .chev{transition:transform .2s;color:var(--muted);flex:none}
details.g[open] summary .chev{transform:rotate(180deg)}
details.g .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.qa{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.qa b{color:var(--navy)}
.script{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:.95rem}
.src{font-size:.78rem;color:var(--muted)}

/* toast */
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));width:min(92%,480px);
  background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}.toast{animation:fade .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
.versao{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:.8rem;color:var(--muted);text-align:left;width:100%}
.versao .st{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block}.dot.ok{background:var(--good)}
.who{font-weight:700;color:var(--slate)}
.topbtns{display:flex;gap:8px;flex:none}
.rec{color:var(--good)}
.vtag{font-weight:800;color:var(--navy);background:var(--navy-soft);border-radius:8px;padding:3px 8px;font-size:.8rem;flex:none}
</style>

<main class="wrap" id="view" aria-live="polite"></main>

<button class="fab" id="fab" type="button" aria-label="Lançar gasto ou receita">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Lançar
</button>

<nav class="nav" aria-label="Seções">
  <div class="in">
    <button type="button" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
    <button type="button" data-tab="espera"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Espera 24h<span class="badge" id="badge" hidden></span></button>
    <button type="button" data-tab="metas"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Metas</button>
    <button type="button" data-tab="guia"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Guia</button>
  </div>
</nav>

<div id="layer"></div>

<script>
(function(){
"use strict";
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const LKEY="painel-familia-local-v2", WHO="painel-familia-quem";
const PESSOAS=["Carlos","Daniela"];

/* ---------- configuração padrão (só para o modo "neste aparelho") ---------- */
function cfgPadrao(){
  return {nome:"Carlos e Daniela", renda:0, fixas:0, metaReserva:0,
    cats:[
      {id:"mercado",nome:"Mercado",ico:"🛒",teto:1000},
      {id:"transporte",nome:"Combustível e transporte",ico:"⛽",teto:1000},
      {id:"fds",nome:"Fins de semana",ico:"🌳",teto:1000},
      {id:"outros",nome:"Padaria, horti, Kevin, remédios",ico:"🥖",teto:500},
      {id:"semana",nome:"Saída da semana",ico:"📅",teto:400},
      {id:"lanches",nome:"Saída e lanches",ico:"🍔",teto:300},
      {id:"fatura",nome:"Fatura do cartão",ico:"💳",teto:800}],
    compromisso:{porque:"",frase:"",assinado:null}};
}

/* ---------- estado bruto vindo do banco ---------- */
const R={cfg:null, lanc:{}, espera:{}, movs:{}, receitas:{}, meta:null};
let S=null;           // estado derivado usado pelas telas
let modo="carregando"; // "sync" | "local" | "carregando"
let quem=null; try{quem=localStorage.getItem(WHO);}catch(e){}

function derivar(){
  if(!R.cfg){S=null;return;}
  const movs=Object.values(R.movs);
  const soma=t=>movs.filter(m=>m.tipo===t).reduce((a,m)=>a+(+m.valor||0),0);
  S={...R.cfg,
    lanc:Object.values(R.lanc),
    receitas:Object.values(R.receitas||{}),
    espera:Object.values(R.espera).map(e=>({...e,criado:Date.parse(e.em)})),
    reserva:{guardado:soma("deposito")+soma("transfer")-soma("retirada"),
      meta:R.cfg.metaReserva||R.cfg.fixas||0,
      hist:movs.filter(m=>m.tipo!=="desistencia").sort((a,b)=>a.em.localeCompare(b.em)).map(m=>({data:m.em.slice(0,10),valor:m.tipo==="retirada"?-m.valor:m.valor,obs:m.tipo==="transfer"?"espera 24h":m.tipo==="retirada"?"uso":"",por:m.por}))},
    economizado:soma("desistencia")-soma("transfer")};
}

/* ---------- camada de gravação: sincronizada (db) ou só neste aparelho ---------- */
let db=null;
const agora=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

function salvarLocal(){try{localStorage.setItem(LKEY,JSON.stringify(R));}catch(e){}}
function carregarLocal(){
  try{const r=JSON.parse(localStorage.getItem(LKEY)||"null"); if(r&&r.cfg){Object.assign(R,r);R.receitas=R.receitas||{};return;}}catch(e){}
  R.cfg=cfgPadrao(); R.meta={versao:1,em:agora(),por:quem||"Carlos",hist:[{v:1,em:agora(),por:quem||"Carlos",o:"Versão inicial"}]}; salvarLocal();
}

let fila=Promise.resolve();
function erroGravar(e){
  if(e&&e.code==="invalid_argument") toast("Este acesso é só de leitura. Peça ao dono do app para te convidar como Editor(a).");
  else if(e&&e.code==="quota_exceeded") toast("O espaço do app está cheio. Apague lançamentos antigos.");
  else if(e&&e.code==="permission-denied") toast("O Firebase recusou a gravação (regras do Firestore).");
  else toast("Não consegui salvar ("+((e&&e.code)||"erro")+"). Verifique a internet.");
}
async function comRetry(fn){try{return await fn();}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn();}throw e;}}

/* sobe a versão e registra quem/quando */
async function subirVersao(o){
  const por=quem||"?";
  if(modo==="local"){
    const v=(R.meta?.versao||0)+1; const h=[{v,em:agora(),por,o},...(R.meta?.hist||[])].slice(0,20);
    R.meta={versao:v,em:agora(),por,hist:h}; salvarLocal(); return;
  }
  if(fbBump){await fbBump(o,por);return;}
  const ref=db.doc("familia/meta");
  for(let t=0;t<8;t++){
    const l=await ref.acquire({holder:uid(),ttlMs:4000}).catch(()=>({acquired:false}));
    if(l.acquired){
      const s=await ref.get(); const m=s.exists?s.data():{versao:0,hist:[]};
      const v=(m.versao||0)+1;
      await comRetry(()=>ref.set({versao:v,em:agora(),por,hist:[{v,em:agora(),por,o},...(m.hist||[])].slice(0,20)}));
      return;
    }
    await new Promise(r=>setTimeout(r,300+Math.random()*400));
  }
}
function gravar(op,o){
  fila=fila.then(async()=>{
    try{
      if(modo==="local"){op.local(); salvarLocal(); await subirVersao(o); derivar(); render(); return true;}
      await comRetry(op.remote); await subirVersao(o); return true;
    }catch(e){erroGravar(e); return false;}
  });
  return fila;
}
const store={

  del(col,id,o){return gravar({local:()=>{delete R[col][id];},remote:()=>db.collection(col).doc(id).delete()},o);},
  cfg(patch,o){const novo={...R.cfg,...patch};

const FKEY="painel-familia-codigo";
let diag=null;
function explicar(e,etapa){
  const c=(e&&e.code)||"desconhecido"; const msg=(e&&e.message)||String(e);
  const mapa={
    "auth/operation-not-allowed":"O login Anônimo não está ativado. No Firebase: Authentication → Método de login → Anônimo → Ativar → Salvar.",
    "auth/admin-restricted-operation":"O login Anônimo não está ativado. No Firebase: Authentication → Método de login → Anônimo → Ativar → Salvar.",
    "auth/configuration-not-found":"O Authentication ainda não foi iniciado no Firebase. Abra Authentication → Vamos começar → ative Anônimo.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"A apiKey do config.js está errada. Copie de novo o firebaseConfig.",
    "auth/invalid-api-key":"A apiKey do config.js está errada. Copie de novo o firebaseConfig.",
    "auth/network-request-failed":"Sem internet ou a rede bloqueou o Firebase. Tente em outra rede (4G).",
    "auth/unauthorized-domain":"O domínio do site não está autorizado. No Firebase: Authentication → Configurações → Domínios autorizados → adicionar cagb-47.github.io.",
    "permission-denied":"As regras do Firestore estão bloqueando. No Firestore → Regras, cole as regras de novo e clique em Publicar.",
    "not-found":"O banco Firestore não foi criado. No Firebase: Firestore Database → Criar banco de dados.",
    "failed-precondition":"O banco Firestore não foi criado ou ainda está sendo criado. Abra Firestore Database no Firebase.",
    "unavailable":"Não consegui falar com o Firebase. Verifique a internet.",
    "sem-resposta":"O banco não respondeu em 20 segundos. Normalmente é o Firestore que não foi criado, ou a internet."
  };
  diag={etapa,code:c,msg,dica:mapa[c]||"Erro não previsto. Mande um print desta tela."};
  console.error("[Painel] "+etapa+": "+c+" — "+msg);
  modo="erro"; render();
}
let codigo=null; try{codigo=localStorage.getItem(FKEY);}catch(e){}
let fbBump=null, cfgOk=false;
function iniciarFirebase(){
  const fb=window.firebase; const app=fb.apps.length?fb.app():fb.initializeApp(window.FIREBASE_CONFIG);
  const fs=fb.firestore(app);
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
  const pref="familias/"+codigo+"/";
  const wrapDoc=s=>({id:s.id,exists:s.exists,data:()=>s.data()});
  const fdb={
    doc(p){const r=fs.doc(pref+p);return{get:()=>r.get().then(wrapDoc),set:d=>r.set(d),delete:()=>r.delete(),
      onSnapshot:(n,e)=>r.onSnapshot(x=>n(wrapDoc(x)),e)};},
    collection(p){const c=fs.collection(pref+p);return{doc:id=>fdb.doc(p+"/"+id),
      onSnapshot:(n,e)=>c.onSnapshot(q=>n({docs:q.docs.map(wrapDoc)}),e),get:()=>c.get().then(q=>({docs:q.docs.map(wrapDoc)}))};}
  };
  fbBump=async(o,por)=>{const r=fs.doc(pref+"familia/meta");
    await fs.runTransaction(async t=>{const s=await t.get(r);const m=s.exists?s.data():{versao:0,hist:[]};const v=(m.versao||0)+1;
      t.set(r,{versao:v,em:agora(),por,hist:[{v,em:agora(),por,o},...(m.hist||[])].slice(0,20)});});};
  modo="carregando"; render();
  fb.auth(app).signInAnonymously().then(()=>{
    let respondeu=false; const t=setTimeout(()=>{if(!respondeu)explicar({code:"sem-resposta",message:"timeout"},"Ler dados");},20000);
    fdb.doc("familia/config").get().then(()=>{respondeu=true;clearTimeout(t);conectar(fdb);}).catch(e=>{respondeu=true;clearTimeout(t);explicar(e,"Ler dados");});
  }).catch(e=>explicar(e,"Login"));
}
function conectar(d){
  db=d; modo="sync"; render();
  const err=e=>{if(window.FIREBASE_CONFIG)explicar(e,"Sincronizar");else if(e&&e.code==="revoked")toast("O acesso aos dados foi retirado.");};
  db.doc("familia/config").onSnapshot(s=>{R.cfg=s.exists?s.data():null; cfgOk=true; derivar(); render();},err);
  db.doc("familia/meta").onSnapshot(s=>{R.meta=s.exists?s.data():null; render();},err);
  ["lanc","espera","movs","receitas"].forEach(col=>db.collection(col).onSnapshot(q=>{
    const o={}; q.docs.forEach(d=>{o[d.id]={id:d.id,...d.data()};}); R[col]=o; derivar(); render();},err));
}
function iniciar(){
  if(window.FIREBASE_CONFIG&&window.firebase){ if(codigo) iniciarFirebase(); else {modo="codigo"; render();} return; }
  const vaiLocal=()=>{if(modo!=="carregando")return; modo="local"; carregarLocal(); derivar(); render();};
  const t=setTimeout(vaiLocal,11000);
  const c=window.claude;
  if(!c||typeof c.use!=="function"){clearTimeout(t); vaiLocal(); return;}
  c.use("db").then(d=>{
    clearTimeout(t);
    if(!d){vaiLocal();return;}
    conectar(d);
  }).catch(()=>{clearTimeout(t);vaiLocal();});
}

const brl=v=>(v<0?"-":"")+"R$ "+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=v=>(v<0?"-":"")+"R$ "+Math.abs(Math.round(v)).toLocaleString("pt-BR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const catById=id=>(S?.cats||[]).find(c=>c.id===id)||{id,nome:"Outro",ico:"•",teto:0};
const fmtData=s=>{const [y,m,d]=String(s).slice(0,10).split("-");return d+"/"+m;};
const fmtQuando=iso=>{const d=new Date(iso); if(isNaN(d))return ""; return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" às "+pad(d.getHours())+":"+pad(d.getMinutes());};

function mesInfo(now=new Date()){
  const y=now.getFullYear(), m=now.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const hoje=ymd(now); const pref=y+"-"+pad(m+1);
  const lanc=S.lanc.filter(l=>l.data.startsWith(pref));
  const teto=S.cats.reduce((a,c)=>a+c.teto,0);
  const gasto=lanc.reduce((a,l)=>a+l.valor,0);
  const gastoHoje=lanc.filter(l=>l.data===hoje).reduce((a,l)=>a+l.valor,0);
  const diasRest=dim-now.getDate()+1;
  const saldo=teto-gasto;
  const podeHoje=(saldo+gastoHoje)/diasRest-gastoHoje;
  const porCat={}; S.cats.forEach(c=>porCat[c.id]=0); lanc.forEach(l=>porCat[l.cat]=(porCat[l.cat]||0)+l.valor);
  const receitas=S.receitas.filter(r=>r.data.startsWith(pref));
  const recebido=receitas.reduce((a,r)=>a+r.valor,0);
  const rendaMes=recebido>0?recebido:(+S.renda||0);
  const tetoDia=S.cats.filter(c=>c.id!=="fatura").reduce((a,c)=>a+c.teto,0)/dim;
  let seq=0;
  for(let d=now.getDate()-1; d>=1; d--){
    const key=pref+"-"+pad(d);
    const g=lanc.filter(l=>l.data===key&&l.cat!=="fatura").reduce((a,l)=>a+l.valor,0);
    if(g<=tetoDia) seq++; else break;
  }
  return {y,m,dim,hoje,pref,lanc,receitas,recebido,rendaMes,teto,gasto,gastoHoje,diasRest,saldo,podeHoje,porCat,tetoDia,seq,nomeMes:MESES[m]};
}
function saudacao(){const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";}
function etapa(){
  const g=S.reserva.guardado, meta=S.reserva.meta||1000;
  if(g<1000) return {n:1,nome:"Sair do sufoco",alvo:1000,de:0,txt:"Juntar os primeiros R$ 1.000, para que um imprevisto não vá parar no cartão."};
  if(g<meta) return {n:2,nome:"Guardar",alvo:meta,de:1000,txt:"Chegar a um mês de contas fixas guardado ("+brl0(meta)+")."};
  return {n:3,nome:"Prosperar",alvo:meta*3,de:meta,txt:"Chegar a três meses de contas fixas e começar a investir com calma."};
}

function vEspera(){
  const itens=[...S.espera].sort((a,b)=>a.criado-b.criado).map(e=>{
    const falta=864e5-(Date.now()-e.criado); const pronto=falta<=0;

    return `<div class="card"><div class="kpi"><b>${esc(e.desc||"Compra")}</b><span class="num"><b>${brl(e.valor)}</b></span></div>

  }).join("");
  return `<header class="top"><div><span class="eyebrow">Escudo contra impulso</span><h1>Espera de 24 horas</h1></div></header>
  <p>Viu algo que quer comprar e não estava no plano? Coloque aqui. Promoções, "últimas unidades" e "só hoje" foram feitas para decidir rápido. Esperar um dia devolve a decisão para vocês.</p>

  ${S.economizado>0?`<p class="small muted">Esse valor pode ir direto para a reserva.</p><button class="btn good" data-act="guardarEcon">Mandar para a reserva</button>`:`<p class="small muted">Cada desistência soma aqui.</p>`}</div>

    <button class="btn" type="submit">Esperar 24 horas</button></form>
  ${itens?`<section class="section"><h2>Em espera</h2>${itens}</section>`:""}`;

/* ---------- METAS ---------- */
function vMetas(){
  const E=etapa(); const g=S.reserva.guardado;
  const p=Math.max(0,Math.min(100,(g-E.de)/(E.alvo-E.de)*100));
  const step=(n,nome,sub)=>`<div class="step ${E.n>n?"done":E.n===n?"now":""}"><span class="small ${E.n===n?"":"muted"}">Etapa ${n}</span><b>${nome}</b><span class="small muted">${sub}</span></div>`;
  const M=mesInfo(); const margem=M.rendaMes-S.fixas-M.teto;
  const hist=S.reserva.hist.slice(-6).reverse().map(h=>`<div class="row"><span class="t"><b class="num">${brl(h.valor)}</b><span class="small muted">${fmtData(h.data)}${h.obs?" · "+esc(h.obs):""}${h.por?" · por "+esc(h.por):""}</span></span></div>`).join("");
  const c=S.compromisso||{};
  return `<header class="top"><div><span class="eyebrow">Sair do sufoco · guardar · prosperar</span><h1>Metas</h1></div></header>
  <div class="steps">${step(1,"Sufoco","R$ 1.000")}${step(2,"Guardar","1 mês de contas")}${step(3,"Prosperar","3 meses")}</div>
  <section class="card"><span class="eyebrow">Agora: ${E.nome}</span><p>${E.txt}</p>
    <div class="prog" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
    <div class="kpi num"><span class="muted">Guardado</span><strong>${brl(g)}</strong></div>
    <p class="small muted num">Faltam ${brl(Math.max(0,E.alvo-g))} para a próxima etapa.</p>
    <div class="btnrow"><button class="btn good" data-act="guardar">Guardamos dinheiro</button>${g>0?`<button class="btn sec" data-act="retirar">Precisamos usar</button>`:""}</div>
  </section>
  <section class="card"><h2>De onde pode vir o dinheiro</h2>
    <p class="num">${M.recebido>0?"Entrou":"Renda prevista"} ${brl0(M.rendaMes)} − contas fixas ${brl0(S.fixas)} − planejado nas categorias ${brl0(M.teto)} = <b>${brl0(margem)}</b> livres por mês.</p>
    <p class="small muted">As três alavancas: tudo que sobrar nas categorias no fim do mês, o que vocês desistirem na espera de 24h e cada conta fixa que conseguirem baixar.</p></section>
  <section class="card"><h2>Nosso compromisso</h2>
    ${c.porque?`<div class="why"><q>${esc(c.porque)}</q>${c.frase?`<span class="small">${esc(c.frase)}</span>`:""}${c.assinado?`<span class="small muted">Assinado em ${fmtData(c.assinado)}${c.por?" por "+esc(c.por):""}</span>`:""}</div>
    <div class="btnrow"><button class="btn sec" data-act="compromisso">Editar</button><button class="btn sec" data-act="compartilhar">Mandar para a família</button></div>`
    :`<p>Escrevam o motivo e o compromisso. Compromissos escritos e contados para outras pessoas são os que a gente mais cumpre.</p><button class="btn" data-act="compromisso">Escrever agora</button>`}
  </section>
  ${hist?`<section class="section"><h2>Últimos movimentos da reserva</h2><div class="list">${hist}</div></section>`:""}`;
}

/* ---------- eventos da view ---------- */
function bind(){
  const fc=document.getElementById("fCod");
  if(fc) fc.onsubmit=ev=>{ev.preventDefault(); const c=document.getElementById("cod").value.trim();
    if(c.length<20||!/^[A-Za-z0-9_-]+$/.test(c)){toast("Código inválido. Confira e tente de novo.");return;}
    codigo=c; try{localStorage.setItem(FKEY,c);}catch(e){} iniciarFirebase();};
  view.querySelectorAll("[data-quem]").forEach(b=>b.onclick=()=>{quem=b.dataset.quem; try{localStorage.setItem(WHO,quem);}catch(e){} render(); toast("Olá, "+quem+"!");});
  view.querySelectorAll("[data-addcat]").forEach(b=>b.onclick=()=>openAdd({cat:b.dataset.addcat}));
  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Apagar";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="✕";}},3000);return;}
    const l=S.lanc.find(x=>x.id===b.dataset.del);
    store.del("lanc",b.dataset.del,"Apagou "+(l?(l.desc||catById(l.cat).nome)+" ("+brl(l.valor)+")":"um gasto")).then(ok=>ok&&toast("Lançamento apagado."));
  });
  view.querySelectorAll("[data-delrec]").forEach(b=>b.onclick=()=>{
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Apagar";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="✕";}},3000);return;}
    const r=S.receitas.find(x=>x.id===b.dataset.delrec);
    store.del("receitas",b.dataset.delrec,"Apagou receita "+(r?(r.desc||"")+" ("+brl(r.valor)+")":"")).then(ok=>ok&&toast("Receita apagada."));
  });
  view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>acts[b.dataset.act]());
  view.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();const d=document.getElementById("g-"+b.dataset.open);if(d){d.open=true;d.scrollIntoView({behavior:"smooth"});}});
  view.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copiar(document.getElementById(b.dataset.copy).textContent,b));
  view.querySelectorAll("[data-desist]").forEach(b=>b.onclick=async()=>{
    const e=S.espera.find(x=>x.id===b.dataset.desist); if(!e)return;
    const ok=await store.del("espera",e.id,"Desistiu de "+(e.desc||"uma compra")+" ("+brl(e.valor)+")");
    if(ok){await store.add("movs",{tipo:"desistencia",valor:e.valor},"Economia de "+brl(e.valor)); toast("Boa decisão. "+brl(e.valor)+" continuam com vocês.");}
  });
  view.querySelectorAll("[data-comprar]").forEach(b=>b.onclick=async()=>{
    const e=S.espera.find(x=>x.id===b.dataset.comprar); if(!e)return;
    const ok=await store.del("espera",e.id,"Tirou da espera: "+(e.desc||"compra"));
    if(ok) openAdd({valor:e.valor,desc:e.desc,cat:e.cat,semPausa:true});
  });
  const fe=document.getElementById("fEspera");
  if(fe) fe.onsubmit=ev=>{ev.preventDefault();
    const v=parseNum(document.getElementById("eVal").value); const d=document.getElementById("eDesc").value.trim();
    if(!(v>0)){toast("Digite o valor da compra.");return;}
    store.add("espera",{desc:d,valor:v,cat:null},"Colocou na espera: "+(d||"compra")+" ("+brl(v)+")").then(ok=>ok&&toast("Combinado. Amanhã a gente pergunta de novo."));
  };
}
const parseNum=s=>{s=String(s||"").replace(/[^\d,.-]/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); return parseFloat(s);};

function copiar(txt,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1500);};
  try{navigator.clipboard.writeText(txt).then(ok,()=>selecionar(btn));}catch(e){selecionar(btn);}
}
function selecionar(btn){const el=btn.previousElementSibling; if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);} toast("Texto selecionado. Use copiar do seu celular.");}

/* ---------- folhas ---------- */
const layer=document.getElementById("layer");
function sheet(html,onMount){
  layer.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  layer.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheet);
  document.body.style.overflow="hidden";
  onMount&&onMount(layer.querySelector(".sheet"));
}
function closeSheet(){layer.innerHTML="";document.body.style.overflow="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML)closeSheet();});

let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3400);
}

/* ---- lançar gasto ---- */
function openAdd(pre){
  const st={cents:Math.round((pre.valor||0)*100),cat:pre.cat||null,pag:"avista",desc:pre.desc||"",semPausa:!!pre.semPausa,tipo:pre.tipo||"gasto"};
  const M=mesInfo();
  sheet(`<div class="sheethead"><h2>Lançar</h2><button class="iconbtn" data-close aria-label="Fechar">✕</button></div>
    <div class="seg" role="group" aria-label="Tipo"><button type="button" data-t="gasto" aria-pressed="${st.tipo==="gasto"}">Gasto</button><button type="button" data-t="receita" aria-pressed="${st.tipo==="receita"}">Receita (entrou dinheiro)</button></div>
    <div class="amount num" id="amt">R$ 0,00</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,"00",0,"⌫"].map(k=>`<button type="button" data-k="${k}" aria-label="${k==="⌫"?"Apagar":k}">${k}</button>`).join("")}</div>
    <div class="gonly catpick" id="cp">${S.cats.map(c=>`<button type="button" data-c="${c.id}" aria-pressed="${st.cat===c.id}"><span aria-hidden="true">${c.ico}</span><span>${esc(c.nome)}</span></button>`).join("")}</div>
    <div class="gonly seg" role="group" aria-label="Forma de pagamento"><button type="button" data-p="avista" aria-pressed="true">Débito, Pix ou dinheiro</button><button type="button" data-p="cartao" aria-pressed="false">Cartão de crédito</button></div>
    <p class="hint" id="addHint"></p>
    <label class="f" for="aDesc"><span id="aDescL">Descrição (opcional)</span><input class="i" id="aDesc" maxlength="60" placeholder="Ex.: padaria" value="${esc(st.desc)}"></label>
    <div id="pauseBox"></div>
    <button class="btn block" id="aSave" type="button">Lançar como ${esc(quem)}</button>`,
  sh=>{
    const amt=sh.querySelector("#amt"), hint=sh.querySelector("#addHint");
    const modo2=()=>{
      const r=st.tipo==="receita";
      sh.querySelectorAll(".gonly").forEach(x=>x.hidden=r);
      sh.querySelector("#aDescL").textContent=r?"De onde veio?":"Descrição (opcional)";
      sh.querySelector("#aDesc").placeholder=r?"Ex.: salário Daniela":"Ex.: padaria";
      amt.classList.toggle("rec",r);
      sh.querySelector("#aSave").textContent=(r?"Lançar receita como ":"Lançar gasto como ")+quem;
    };
    sh.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{st.tipo=b.dataset.t;sh.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b));modo2();upd();});
    const upd=()=>{
      amt.textContent=brl(st.cents/100);
      if(st.tipo==="receita"){hint.textContent=M.rendaMes?"":"";sh.querySelector("#pauseBox").innerHTML="";return;}
      let h="";
      if(st.cat){const c=catById(st.cat), resto=c.teto-(M.porCat[st.cat]||0)-st.cents/100;
        h=resto>=0?`Depois deste gasto, sobram ${brl(resto)} em ${c.nome}.`:`Este gasto passa ${brl(-resto)} do teto de ${c.nome}.`;}
      if(st.pag==="cartao"&&st.cat!=="fatura") h+=` No cartão, ele volta na fatura do mês que vem, que tem teto de ${brl0(catById("fatura").teto)}.`;
      hint.textContent=h; sh.querySelector("#pauseBox").innerHTML=""; st.pausou=false;
    };
    sh.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==="⌫") st.cents=Math.floor(st.cents/10);
      else if(k==="00") st.cents=Math.min(99999999,st.cents*100);
      else st.cents=Math.min(99999999,st.cents*10+Number(k));
      upd();
    });
    sh.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;sh.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));upd();});
    sh.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{st.pag=b.dataset.p;sh.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===b));upd();});
    let enviando=false;
    const commit=async()=>{
      if(enviando)return; enviando=true;
      const v=st.cents/100, c=catById(st.cat), desc=sh.querySelector("#aDesc").value.trim();
      closeSheet();
      const ok=await store.add("lanc",{data:ymd(new Date()),valor:v,cat:st.cat,desc,pag:st.pag},"Lançou "+(desc||c.nome)+" ("+brl(v)+")");
      if(ok){const n=mesInfo().lanc.length; toast(n%5===0?`Lançado. Já são ${n} gastos anotados neste mês. Quem anota, controla.`:(modo==="sync"?"Lançado e sincronizado. Obrigado por anotar.":"Lançado. Obrigado por anotar."));}
    };
    sh.querySelector("#aSave").onclick=async()=>{
      const v=st.cents/100;
      if(!(v>0)){toast("Digite o valor.");return;}
      if(st.tipo==="receita"){
        if(enviando)return; enviando=true;
        const desc=sh.querySelector("#aDesc").value.trim(); closeSheet();
        const ok=await store.add("receitas",{data:ymd(new Date()),valor:v,desc},"Lançou receita "+(desc||"")+" ("+brl(v)+")");
        if(ok)toast("Receita lançada. +"+brl(v)+" no mês.");
        return;
      }
      if(!st.cat){toast("Escolha em qual parte do orçamento entra.");return;}
      const c=catById(st.cat), resto=c.teto-(M.porCat[st.cat]||0)-v;
      const precisaPausa=!st.semPausa&&st.cat!=="fatura"&&(resto<0||v>Math.max(100,M.podeHoje));
      if(precisaPausa&&!st.pausou){
        st.pausou=true;
        const novoDia=(M.saldo-v)/M.diasRest;
        sh.querySelector("#pauseBox").innerHTML=`<div class="pause"><span class="eyebrow">Pausa de 10 segundos</span><h3>Isso é necessidade ou vontade?</h3>
          <p class="num">Com este gasto, o limite dos próximos dias cai para <b>${brl(Math.max(0,novoDia))}</b> por dia${resto<0?` e ${esc(c.nome)} passa do teto`:""}.</p>
          <div class="btnrow"><button class="btn" type="button" id="pEsp">Esperar 24 horas</button><button class="btn sec" type="button" id="pOk">É necessário</button></div></div>`;
        sh.querySelector("#pEsp").onclick=async()=>{const d=sh.querySelector("#aDesc").value.trim()||c.nome; closeSheet();
          const ok=await store.add("espera",{desc:d,valor:v,cat:st.cat},"Colocou na espera: "+d+" ("+brl(v)+")"); if(ok)toast("Ficou na espera. Amanhã vocês decidem com calma.");};
        sh.querySelector("#pOk").onclick=commit;
        sh.querySelector("#pauseBox").scrollIntoView({behavior:"smooth",block:"center"});
        return;
      }
      commit();
    };
    modo2(); upd();
  });
}

/* ---- outras ações ---- */
async function importarR(o,txt){
  const cols=["lanc","espera","movs","receitas"];
  try{
    if(o.cfg) await db.doc("familia/config").set(o.cfg);
    for(const c of cols){for(const [id,d] of Object.entries(o[c]||{})){const {id:_x,...body}=d; await db.collection(c).doc(id).set(body);}}
    await subirVersao(txt||"Importou os dados do app antigo"); return true;
  }catch(e){erroGravar(e);return false;}
}
const instalado=(()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}catch(e){return false;}})();
const acts={
  tentar(){location.reload();},
  trocarCodigo(){try{localStorage.removeItem(FKEY);}catch(e){} location.reload();},
  fechar(){ try{window.close();}catch(e){} setTimeout(()=>toast("Os dados já estão salvos. Para fechar, use o botão Voltar ou deslize o app para cima."),250); },
  async importar(){
    let o; try{o=JSON.parse(document.getElementById("impTxt").value);}catch(e){}
    if(!o||!o.cfg){toast("Esse texto não é uma cópia de segurança válida.");return;}
    if(await importarR(o)) toast("Dados importados.");
  },
  async importarOutubro(){
    const cfg={...cfgPadrao(),renda:13436,fixas:8215.80,metaReserva:8215.80};
    const L=(id,data,valor,cat,desc,pag,em)=>[id,{data,valor,cat,desc,pag,por:"Carlos",em}];
    const lanc=Object.fromEntries([
      L("s1","2026-10-09",1757.10,"fatura","Fatura Itaú","cartao","2026-10-09T12:00:00.000Z"),
      L("s2","2026-10-07",390,"mercado","Tenda","avista","2026-10-07T12:00:00.000Z"),
      L("s3","2026-10-08",160,"lanches","BK","avista","2026-10-08T12:03:00.000Z"),
      L("s4","2026-10-07",50,"transporte","Gasolina","avista","2026-10-07T12:01:00.000Z"),
      L("s5","2026-10-08",36,"transporte","Uber","avista","2026-10-08T12:01:00.000Z"),
      L("s6","2026-10-08",17,"transporte","Transporte","avista","2026-10-08T12:02:00.000Z")]);
    if(!quem){quem="Carlos";}
    if(await importarR({cfg,lanc,espera:{},movs:{},receitas:{}},"Versão inicial com os dados de outubro")){quem=null;try{quem=localStorage.getItem(WHO);}catch(e){} render(); toast("Dados de outubro trazidos.");}
  },
  async comecarVazio(){ try{await db.doc("familia/config").set(cfgPadrao()); await subirVersao("Começou a família do zero");}catch(e){erroGravar(e);} },
  novaReceita(){openAdd({tipo:"receita"});},
  historico(){
    const h=(R.meta?.hist||[]);
    sheet(`<div class="sheethead"><h2>Histórico de atualizações</h2><button class="iconbtn" data-close aria-label="Fechar">✕</button></div>
      <p class="hint">${modo==="sync"?"Tudo o que um lança aparece no celular do outro em segundos.":"Este aparelho não está conectado ao banco da família: os dados ficam só aqui."}</p>
      <div class="list">${h.length?h.map(x=>`<div class="row"><span class="vtag num">v${x.v}</span><span class="t"><b>${esc(x.o||"Atualização")}</b><span class="small muted">${fmtQuando(x.em)} · por ${esc(x.por)}</span></span></div>`).join(""):`<div class="empty">Nenhuma atualização ainda.</div>`}</div>`);
  },
  compromisso(){
    const c=S.compromisso||{};
    sheet(`<div class="sheethead"><h2>Nosso compromisso</h2><button class="iconbtn" data-close aria-label="Fechar">✕</button></div>
      <label class="f" for="cPq">Por que vocês querem sair do aperto?<textarea class="i" id="cPq" maxlength="160" placeholder="Ex.: Dormir tranquilos e dar ao Kevin um futuro sem dívidas.">${esc(c.porque)}</textarea></label>
      <label class="f" for="cFr">O que vocês se comprometem a fazer?<textarea class="i" id="cFr" maxlength="200" placeholder="Ex.: Anotar todo gasto no mesmo dia e esperar 24h antes de qualquer compra fora do plano.">${esc(c.frase)}</textarea></label>
      <p class="hint">Escrevam com as suas palavras. Ao assinar, a data e o nome ficam registrados.</p>
      <button class="btn block" id="cOk" type="button">Assinar como ${esc(quem)}</button>`,sh=>{
      sh.querySelector("#cOk").onclick=()=>{const pq=sh.querySelector("#cPq").value.trim(); if(!pq){toast("Escreva o porquê.");return;}
        const fr=sh.querySelector("#cFr").value.trim(); closeSheet();
        store.cfg({compromisso:{porque:pq,frase:fr,assinado:ymd(new Date()),por:quem}},"Assinou o compromisso").then(ok=>ok&&toast("Compromisso assinado."));};
    });
  },
  compartilhar(){
    const c=S.compromisso; const E=etapa();
    const t=`Carlos e Daniela, nosso compromisso com a família:\n\n"${c.porque}"\n${c.frase?"\n"+c.frase+"\n":""}\nNossa próxima meta: ${E.nome.toLowerCase()} (${brl0(E.alvo)} guardados). Contamos com vocês.`;
    sheet(`<div class="sheethead"><h2>Mandar para a família</h2><button class="iconbtn" data-close aria-label="Fechar">✕</button></div>
      <p class="hint">Contar o compromisso para outras pessoas aumenta a chance de cumprir. Copie e mande no grupo da família.</p>
      <div class="script" id="txtComp">${esc(t)}</div><button class="btn block" data-copy2="txtComp" type="button">Copiar mensagem</button>`,sh=>{
      const b=sh.querySelector("[data-copy2]"); b.onclick=()=>copiar(sh.querySelector("#txtComp").textContent,b);
    });
  },
  guardar(){ valorSheet("Guardamos dinheiro","Quanto foi para a reserva?","Guardar",v=>{
    store.add("movs",{tipo:"deposito",valor:v},"Guardou "+brl(v)+" na reserva").then(ok=>{if(ok){const E=etapa(); toast(`Mais ${brl(v)} guardados. Faltam ${brl(Math.max(0,E.alvo-S.reserva.guardado))} para a próxima etapa.`);}});}); },
  retirar(){ valorSheet("Precisamos usar a reserva","Quanto saiu?","Registrar",v=>{v=Math.min(v,S.reserva.guardado);
    store.add("movs",{tipo:"retirada",valor:v},"Usou "+brl(v)+" da reserva").then(ok=>ok&&toast("Registrado. É para isso que a reserva existe."));}); },
  guardarEcon(){ const v=S.economizado; store.add("movs",{tipo:"transfer",valor:v},"Mandou "+brl(v)+" da espera para a reserva").then(ok=>ok&&toast(brl(v)+" foram para a reserva.")); },
  ajustes(){
    sheet(`<div class="sheethead"><h2>Ajustes</h2><button class="iconbtn" data-close aria-label="Fechar">✕</button></div>
      <div class="f">Quem usa este celular
        <div class="seg" role="group" aria-label="Quem usa este celular">${PESSOAS.map(p=>`<button type="button" data-q="${p}" aria-pressed="${quem===p}">${p}</button>`).join("")}</div></div>
      <label class="f" for="jNome">Nomes na saudação<input class="i" id="jNome" value="${esc(S.nome)}" maxlength="40"></label>
      <label class="f" for="jRenda">Renda prevista do mês (as receitas lançadas substituem este valor)<input class="i num" id="jRenda" inputmode="decimal" value="${(+S.renda).toFixed(2).replace(".",",")}"></label>
      <label class="f" for="jFixas">Contas fixas do mês<input class="i num" id="jFixas" inputmode="decimal" value="${(+S.fixas).toFixed(2).replace(".",",")}"></label>
      <h3>Teto de cada parte</h3>
      ${S.cats.map(c=>`<label class="f" for="t_${c.id}">${c.ico} ${esc(c.nome)}<input class="i num" id="t_${c.id}" inputmode="decimal" value="${(+c.teto).toFixed(2).replace(".",",")}"></label>`).join("")}
      <button class="btn block" id="jOk" type="button">Salvar ajustes</button>
      <h3>Cópia de segurança</h3>
      <p class="hint">${modo==="sync"?"Os dados já ficam guardados online e aparecem nos dois celulares. A cópia é uma garantia extra.":"Os dados ficam só neste aparelho. Copie a cópia de vez em quando e guarde num lugar seguro."}</p>
      <button class="btn sec block" id="bCopy" type="button">Copiar cópia de segurança</button>
      <textarea class="i" id="bTxt" aria-label="Cópia de segurança" readonly hidden></textarea>`,sh=>{
      sh.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{quem=b.dataset.q;try{localStorage.setItem(WHO,quem);}catch(e){} sh.querySelectorAll("[data-q]").forEach(x=>x.setAttribute("aria-pressed",x===b)); render(); toast("Agora este celular lança como "+quem+".");});
      sh.querySelector("#jOk").onclick=()=>{
        const patch={nome:sh.querySelector("#jNome").value.trim()||S.nome};
        const r=parseNum(sh.querySelector("#jRenda").value), f=parseNum(sh.querySelector("#jFixas").value);
        if(r>=0)patch.renda=r; if(f>=0){patch.fixas=f; patch.metaReserva=f;}
        patch.cats=S.cats.map(c=>{const v=parseNum(sh.querySelector("#t_"+c.id).value); return {...c,teto:v>=0?v:c.teto};});
        closeSheet(); store.cfg(patch,"Mudou os ajustes do orçamento").then(ok=>ok&&toast("Ajustes salvos."));};
      sh.querySelector("#bCopy").onclick=()=>{const t=JSON.stringify(R); const ta=sh.querySelector("#bTxt");
        try{navigator.clipboard.writeText(t).then(()=>toast("Cópia de segurança copiada."),()=>{ta.hidden=false;ta.value=t;ta.select();toast("Selecione o texto e copie.");});}catch(e){ta.hidden=false;ta.value=t;}};
    });
  }
};
function valorSheet(titulo,lbl,btn,cb){
  sheet(`<div class="sheethead"><h2>${titulo}</h2><button class="iconbtn" data-close aria-label="Fechar">✕</button></div>
    <label class="f" for="vV">${lbl}<input class="i num" id="vV" inputmode="decimal" placeholder="0,00"></label>
    <button class="btn block good" id="vOk" type="button">${btn}</button>`,sh=>{
    const i=sh.querySelector("#vV"); setTimeout(()=>i.focus(),50);
    sh.querySelector("#vOk").onclick=()=>{const v=parseNum(i.value); if(!(v>0)){toast("Digite um valor.");return;} closeSheet(); cb(v);};
  });
}

render();
iniciar();
setInterval(()=>{if(!layer.innerHTML&&tab==="espera"&&S)render();},60000);
})();
